name: DSHA Termux Bridge test APK
on:
  push:
    branches: [feature/dsha-termux-bridge]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dsha-termux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: Termux bridge MCP contract tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Validate tool syntax and inputs
        run: |
          node --check app/src/main/assets/builtin-plugins/dsh-tool-termux/lib/server.cjs
          node --check app/src/main/assets/builtin-plugins/dsh-tool-termux/lib/index.js
          node --test tools/termux-bridge-tests/test_server.cjs
  inputs:
    uses: ./.github/workflows/_node-inputs.yml
    with:
      rebuild_runtime: true
      artifact: termux-bridge-runtime
  package-tests:
    name: Build and sign test-only Android APK
    needs: [contracts, inputs]
    uses: ./.github/workflows/_node-test-packages.yml
    with:
      variants: debug
      release_identity: mod
      handoff: ${{ needs.inputs.outputs.artifact }}
      fixture: false
      asset_sha: ${{ needs.inputs.outputs.sha256 }}
      asset_format: ${{ needs.inputs.outputs.format }}
      artifact_prefix: termux-bridge
      apk_name_prefix: dsha-termux
      retention_days: 14
      require_configured_key: false
      require_pinned_cert: false
