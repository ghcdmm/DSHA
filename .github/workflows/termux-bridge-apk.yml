name: DSHA Termux Bridge test APK
on:
  push:
    branches: [feature/dsha-termux-bridge]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dsha-termux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inputs:
    uses: ./.github/workflows/_node-inputs.yml
    with:
      rebuild_runtime: true
      artifact: termux-bridge-runtime
  build:
    name: Test bridge and build signed coexistence APK
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/android-sdk
        with:
          ndk: 'true'
      - uses: ./.github/actions/restore-handoff
        with:
          artifact: ${{ needs.inputs.outputs.artifact }}
      - name: Check MCP syntax and tools
        run: |
          node --check app/src/main/assets/builtin-plugins/dsh-tool-termux/lib/server.cjs
          node --check app/src/main/assets/builtin-plugins/dsh-tool-termux/lib/index.js
          node --test tools/termux-bridge-tests/test_server.cjs
          node -e "const m=require('./app/src/main/assets/builtin-plugins/dsh-tool-termux/lib/server.cjs'); if(m.tools.length!==2)process.exit(1); m.validate({name:'probe',args:[]});"
      - name: Run script policy unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testStandardDebugUnitTest \
            --tests 'com.deepseekharness.app.termux.TermuxScriptPolicyTest' \
            -Pdsha.identity=mod -Pdsha.debugPackage=true \
            -Pdsha.sourceOnlyTests=true --no-daemon --max-workers=2
      - name: Compile unsigned standalone debug APK
        run: |
          ./gradlew :app:assembleStandardDebug -Pdsha.identity=mod \
            -Pdsha.debugPackage=true -Pdsha.unsignedPackage=true \
            --no-daemon --max-workers=2
      - name: Sign with ephemeral nonproduction certificate
        run: |
          set -euo pipefail
          mkdir -p out
          mapfile -t apk_input < <(find app/build/outputs/apk/standard/debug -maxdepth 1 -name '*-unsigned.apk' -type f)
          test "${#apk_input[@]}" -eq 1
          key="$RUNNER_TEMP/termux-bridge-test.jks"
          password="$(python3 -c 'import secrets;print(secrets.token_hex(24))')"
          echo "::add-mask::$password"
          export TEST_KEY_PASSWORD="$password"
          keytool -genkeypair -keystore "$key" -storetype PKCS12 -alias bridge-test \
            -keyalg RSA -keysize 3072 -validity 365 \
            -dname 'CN=DSHA Termux Bridge Test, O=Untrusted Development Build' \
            -storepass:env TEST_KEY_PASSWORD -keypass:env TEST_KEY_PASSWORD
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          tools="$(python3 tools/ci-toolchain.py --field buildTools)"
          apk="out/dsha-termux-bridge-${GITHUB_SHA:0:8}.apk"
          "$sdk/build-tools/$tools/apksigner" sign --ks "$key" \
            --ks-key-alias bridge-test --ks-pass env:TEST_KEY_PASSWORD \
            --key-pass env:TEST_KEY_PASSWORD --out "$apk" "${apk_input[0]}"
          "$sdk/build-tools/$tools/apksigner" verify --verbose --print-certs "$apk" > out/signature.txt
          "$sdk/build-tools/$tools/aapt2" dump badging "$apk" > out/badging.txt
          expected="$(python3 tools/release-identity.py --identity mod --field packageName).debug"
          package="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" out/badging.txt)"
          test "$package" = "$expected"
          sha256sum "$apk" > out/SHA256SUMS
          echo "$GITHUB_SHA" > out/commit.txt
          rm -f "$key"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsha-termux-bridge-test-apk
          path: out/
          retention-days: 14
          if-no-files-found: error
